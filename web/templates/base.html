<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}tg115bot{% endblock %} · 管理台</title>
  <script src="https://unpkg.com/htmx.org@1.9.12" crossorigin="anonymous"></script>
  <style>
    :root { --bg:#1e1e2e; --panel:#2a2a3c; --fg:#e4e4ef; --muted:#9a9ab0; --acc:#89b4fa; --ok:#a6e3a1; --warn:#f9e2af; --err:#f38ba8; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system,"Segoe UI",Roboto,"Noto Sans CJK SC",sans-serif; }
    header { display:flex; gap:18px; align-items:center; padding:10px 18px; background:#181825; border-bottom:1px solid #313244; flex-wrap:wrap; }
    header h1 { font-size:16px; margin:0; font-weight:600; }
    nav a { color:var(--muted); text-decoration:none; padding:6px 10px; border-radius:6px; }
    nav a:hover { background:#313244; color:var(--fg); }
    nav a.active { background:var(--acc); color:#1e1e2e; font-weight:600; }
    main { padding:18px; max-width:1200px; margin:0 auto; }
    .grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); margin-bottom:18px; }
    .card { background:var(--panel); border:1px solid #313244; border-radius:10px; padding:14px; }
    .card h3 { margin:0 0 8px; font-size:12px; text-transform:uppercase; color:var(--muted); letter-spacing:.5px; }
    .big { font-size:26px; font-weight:700; }
    table { width:100%; border-collapse:collapse; background:var(--panel); border-radius:10px; overflow:hidden; }
    th,td { padding:8px 10px; text-align:left; border-bottom:1px solid #313244; }
    th { color:var(--muted); font-size:12px; text-transform:uppercase; }
    td.mono, .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; }
    .badge { padding:1px 7px; border-radius:10px; font-size:11px; }
    .ok{color:var(--ok)} .err{color:var(--err)} .warn{color:var(--warn)} .muted{color:var(--muted)}
    .bar { height:6px; background:#313244; border-radius:3px; overflow:hidden; margin-top:4px; }
    .bar > div { height:100%; background:var(--acc); }
    form.inline { display:inline; }
    input,select,textarea { background:#181825; color:var(--fg); border:1px solid #313244; border-radius:6px; padding:6px 8px; font:inherit; }
    button,.btn { background:var(--acc); color:#1e1e2e; border:0; border-radius:6px; padding:6px 12px; font-weight:600; cursor:pointer; text-decoration:none; }
    button.danger { background:var(--err); color:#1e1e2e; }
    button.ghost,.btn.ghost { background:#313244; color:var(--fg); font-weight:400; }
    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .hint { color:var(--muted); font-size:12px; }
    dialog { background:var(--panel); color:var(--fg); border:1px solid #313244; border-radius:10px; padding:18px; min-width:360px; max-width:92vw; }
    dialog::backdrop { background:rgba(0,0,0,.55); }
    dialog h3 { margin:0 0 6px; }
    pre.log { background:#181825; border:1px solid #313244; border-radius:10px; padding:12px; overflow:auto; max-height:62vh; font-size:12px; line-height:1.45; white-space:pre-wrap; word-break:break-all; }
  </style>
</head>
<body>
  <header>
    <h1>tg115bot</h1>
    <nav>
      <a href="/" class="{% if active=='dashboard' %}active{% endif %}">仪表盘</a>
      <a href="/files" class="{% if active=='files' %}active{% endif %}">文件</a>
      <a href="/offline" class="{% if active=='offline' %}active{% endif %}">离线任务</a>
      <a href="/tasks" class="{% if active=='tasks' %}active{% endif %}">任务历史</a>
      <a href="/accounts" class="{% if active=='accounts' %}active{% endif %}">账号</a>
      <a href="/channels" class="{% if active=='channels' %}active{% endif %}">频道规则</a>
      <a href="/logs" class="{% if active=='logs' %}active{% endif %}">日志</a>
      <a href="/config" class="{% if active=='config' %}active{% endif %}">配置</a>
    </nav>
    <span class="hint" style="margin-left:auto">队列待处理: <b>{{ qsize }}</b></span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
